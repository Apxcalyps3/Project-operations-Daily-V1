<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .brand-green { fill: #609A76; }
    </style>
  </defs>

  <!-- 1. Outer C Ring (Left Crescent) -->
  <!-- Outer circle radius 236 centered at (256, 256), thickness ~62px on left, tapering slightly near terminals -->
  <path class="brand-green" d="
    M 440, 120
    A 236 236 0 1 0 440, 392
    L 398, 360
    A 180 180 0 1 1 398, 152
    Z
  " />

  <!-- 2. Central Serif Pillar 'I' -->
  <!-- Top and bottom bracketed Roman serifs with central vertical column -->
  <path class="brand-green" d="
    M 198, 76
    L 314, 76
    C 314, 98 306, 110 280, 114
    L 280, 398
    C 306, 402 314, 414 314, 436
    L 198, 436
    C 198, 414 206, 402 232, 398
    L 232, 114
    C 206, 110 198, 98 198, 76
    Z
  " />

  <!-- 3. Curved Lobe 'D' -->
  <!-- Typographic stroke modulation: starts thin (~16px) at top junction with 'I',
       swells to ~46px at outer right apex, and thins back down to ~16px at bottom junction -->
  <path class="brand-green" d="
    M 256, 126
    C 336, 126 438, 160 442, 256
    C 438, 352 336, 386 256, 386
    L 256, 364
    C 328, 364 394, 330 396, 256
    C 394, 182 328, 148 256, 148
    Z
  " />
</svg>